name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Gmail Storage Lens keeps a strict privacy model, so please check the [privacy guide](https://github.com/Shuvam-Banerji-Seal/gmail-drive-storage-lens/blob/main/docs/privacy.md) and the [roadmap](https://github.com/Shuvam-Banerji-Seal/gmail-drive-storage-lens/blob/main/docs/roadmap.md) before you submit. Large ideas are often best discussed first in [Discussions](https://github.com/Shuvam-Banerji-Seal/gmail-drive-storage-lens/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gmail explorer
        - Drive explorer
        - Cleanup and deletion
        - Setup and sign-in
        - Charts and visualisation
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Gmail Storage Lens reads metadata only and contacts only Google's hosts. Does your idea fit that model?
      options:
        - label: The idea reads only metadata (headers, sizes, labels, file metadata), not message bodies or file contents.
        - label: The idea needs no new network host and no analytics or third-party script.
        - label: I understand that a feature needing those would need a separate, open discussion.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples from other tools (describe them), or related issues.
